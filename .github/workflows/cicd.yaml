run-name: test
on: 
  push:
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: check
        run: echo "chehk"
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11
      - uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
      - name: dep
        run: pnpm install
      - name: Build Slidev deck
        run: npx slidev build --base /${{ github.event.repository.name}}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4